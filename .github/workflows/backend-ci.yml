name: Backend CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: outbox_test
          POSTGRES_USER: outbox_user
          POSTGRES_PASSWORD: pericard42
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U outbox_user -d outbox_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    env:
      OUTBOX_ENV: test
      OUTBOX_JWT_SECRET_KEY: ci-only-test-secret-key-at-least-32-bytes

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Compile backend sources and tests
        run: uv run python -m compileall -q app migrations tests

      - name: Create application database schema
        env:
          PGPASSWORD: pericard42
        run: >-
          psql
          --host=localhost
          --username=outbox_user
          --dbname=outbox_test
          --command="CREATE SCHEMA IF NOT EXISTS outbox;"

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Run complete backend test suite
        run: uv run pytest -q
