delivery:
  max_attempts: 5
  timeout_seconds: 10
  retry:
    strategy: exponential
    initial_delay_seconds: 5
    max_delay_seconds: 600
    jitter: true
  http:
    require_https: true

worker:
  interval_seconds: 300

metrics:
  builder:
    max_enum_values: 20
    max_labels: 5
    max_path_length: 512
    max_path_segments: 32
    max_schema_depth: 32
    max_schema_fields: 1000
    max_label_name_length: 128
  execution:
    batch_size: 100
    max_attempts: 5
    retry:
      initial_delay_seconds: 5
      max_delay_seconds: 600

security:
  jwt:
    secret_key: "CHANGE_ME_WITH_A_RANDOM_SECRET_AT_LEAST_32_BYTES"
    algorithm: "HS256"
    access_token_expire_minutes: 30
  destination_secrets:
    provider: environment

database:
  url: postgresql+psycopg://CHANGE_ME:CHANGE_ME@localhost:5432/outbox
