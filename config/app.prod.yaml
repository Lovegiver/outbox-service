delivery:
  max_attempts: 5
  timeout_seconds: 10
  retry_delay_seconds: 300

worker:
  interval_seconds: 300

security:
  jwt:
    secret_key: "replace-with-long-random-secret"
    algorithm: "HS256"
    access_token_expire_minutes: 30

database:
  url: postgresql+psycopg://CHANGE_ME:CHANGE_ME@localhost:5432/outbox