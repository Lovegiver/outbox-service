delivery:
  max_attempts: 3
  timeout_seconds: 5
  retry:
    strategy: exponential
    initial_delay_seconds: 5
    max_delay_seconds: 600
    jitter: false
  http:
    require_https: false

worker:
  enabled: false
  interval_seconds: 10

metrics:
  execution:
    batch_size: 100
    max_attempts: 3
    retry:
      initial_delay_seconds: 0
      max_delay_seconds: 0

security:
  jwt:
    secret_key: "replace-with-long-random-secret-at-least-32-bytes"
    algorithm: "HS256"
    access_token_expire_minutes: 600
  destination_secrets:
    provider: environment

database:
  url: postgresql+psycopg://outbox_user:pericard42@localhost:5432/outbox_test
